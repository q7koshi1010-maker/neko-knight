    <path d="M46,58 C46,52 52,49 58,49 C64,49 70,52 70,58 C70,65 64,69 58,69 C52,69 46,65 46,58 Z" fill="#fdfdfb"/>

    <!-- ===== SPOTS (black) ===== -->
    <ellipse cx="49" cy="39" rx="3" ry="2.4" fill="#2b2b2b" stroke="none" transform="rotate(-20 49 39)"/>
    <ellipse cx="67" cy="39" rx="3" ry="2.4" fill="#2b2b2b" stroke="none" transform="rotate(20 67 39)"/>
    <ellipse cx="58" cy="35" rx="2.6" ry="2" fill="#2b2b2b" stroke="none"/>
    <ellipse cx="41" cy="50" rx="2.6" ry="2" fill="#2b2b2b" stroke="none"/>
    <ellipse cx="75" cy="50" rx="2.6" ry="2" fill="#2b2b2b" stroke="none"/>

    <!-- ===== EYE PATCHES (black almond) + eyes ===== -->
    <path d="M46,48 C48,43 54,43 56,49 C54,53 48,53 46,50 Z" fill="#2b2b2b" stroke="none"/>
    <path d="M60,49 C62,43 68,43 70,48 C68,53 62,53 60,50 Z" fill="#2b2b2b" stroke="none"/>
    <circle cx="51.5" cy="47.5" r="1.7" fill="#ffffff" stroke="none"/>
    <circle cx="65.5" cy="47.5" r="1.7" fill="#ffffff" stroke="none"/>

    <!-- ===== NOSE + SMILE (on muzzle) ===== -->
    <path d="M55,57 L61,57 L58,60 Z" fill="#3a2d24" stroke-width="1.4"/>
    <path d="M58,60 Q54,64 51,61" fill="none" stroke-width="2"/>
    <path d="M58,60 Q62,64 65,61" fill="none" stroke-width="2"/>
