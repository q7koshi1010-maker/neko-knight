    <path d="M72,39 C75,31 74,24 70,22 C66,24 65,33 67,40 Z" fill="#2b2b2b" stroke="none"/>

    <!-- ===== BODY (yellow, 2 legs) ===== -->
    <path d="M45,70 C37,80 36,98 40,110 C42,116 45,120 48,121 C49,123 52,123 53,121
             C55,118 57,116 58,116 C59,116 61,118 63,121 C64,123 67,123 68,121
