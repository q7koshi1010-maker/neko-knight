    <path d="M46,80 Q38,84 34,90" fill="none" stroke="#ffd21e" stroke-width="6"/>
    <path d="M70,80 Q78,84 82,90" fill="none" stroke="#4a3728" stroke-width="10"/>
    <path d="M70,80 Q78,84 82,90" fill="none" stroke="#ffd21e" stroke-width="6"/>

    <!-- ===== HEAD (yellow) ===== -->
    <circle cx="58" cy="50" r="23" fill="#ffd21e"/>
