    <!-- ===== FACE ===== -->
    <ellipse cx="51" cy="55" rx="5.2" ry="6.6" fill="#1a1a1a" stroke="none"/>
    <ellipse cx="67" cy="55" rx="5.2" ry="6.6" fill="#1a1a1a" stroke="none"/>
    <circle cx="49.3" cy="52.3" r="1.9" fill="#ffffff" stroke="none"/>
