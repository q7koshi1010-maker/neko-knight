<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 256">
  <!-- 滝の一区画：ターコイズのベタに波打つ縦の水流線。上下端シームレス（縦に積んで繋がる／周期64）。左右の縁は少し波打つ。 -->
  <!-- 水のベタ本体（左右の縁が波打つ・上下端 x が一致して縦シームレス） -->
  <path d="M9,0
           Q3,16 9,32 Q15,48 9,64 Q3,80 9,96 Q15,112 9,128
           Q3,144 9,160 Q15,176 9,192 Q3,208 9,224 Q15,240 9,256
           L111,256
           Q105,240 111,224 Q117,208 111,192 Q105,176 111,160 Q117,144 111,128
           Q105,112 111,96 Q117,80 111,64 Q105,48 111,32 Q117,16 111,0 Z"
        fill="#a9ebe0"/>
  <!-- 波打つ縦の水流線（周期64・上下端 x 一致でシームレス） -->
  <g fill="none" stroke="#6fd0e0" stroke-linecap="round">
    <path d="M40,0 Q34,16 40,32 Q46,48 40,64 Q34,80 40,96 Q46,112 40,128
             Q34,144 40,160 Q46,176 40,192 Q34,208 40,224 Q46,240 40,256"
          stroke-width="4"/>
    <path d="M72,0 Q78,16 72,32 Q66,48 72,64 Q78,80 72,96 Q66,112 72,128
             Q78,144 72,160 Q66,176 72,192 Q78,208 72,224 Q66,240 72,256"
          stroke-width="4"/>
    <path d="M56,0 Q50,16 56,32 Q62,48 56,64 Q50,80 56,96 Q62,112 56,128
             Q50,144 56,160 Q62,176 56,192 Q50,208 56,224 Q62,240 56,256"
          stroke-width="2.4" stroke-opacity="0.7"/>
    <path d="M92,0 Q86,16 92,32 Q98,48 92,64 Q86,80 92,96 Q98,112 92,128
             Q86,144 92,160 Q98,176 92,192 Q86,208 92,224 Q98,240 92,256"
          stroke-width="2.4" stroke-opacity="0.6"/>
    <path d="M24,0 Q30,16 24,32 Q18,48 24,64 Q30,80 24,96 Q18,112 24,128
             Q30,144 24,160 Q18,176 24,192 Q30,208 24,224 Q18,240 24,256"
          stroke-width="2.4" stroke-opacity="0.6"/>
  </g>
  <!-- 明るい水しぶきのハイライト線 -->
  <path d="M48,0 Q42,16 48,32 Q54,48 48,64 Q42,80 48,96 Q54,112 48,128
           Q42,144 48,160 Q54,176 48,192 Q42,208 48,224 Q54,240 48,256"
        fill="none" stroke="#e2fbf6" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
</svg>
