<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <g stroke="#4a3728" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== EARS (round black, on top of head) ===== -->
    <circle cx="39" cy="21" r="9.5" fill="#2b2b2b"/>
    <circle cx="75" cy="21" r="9.5" fill="#2b2b2b"/>

    <!-- ===== BODY (white round body below head, 2 short legs, feet y~122) ===== -->
    <path d="M42,64
             C34,74 33,92 37,104
             C39,111 43,118 46,121
             C47,123 50,123 51,121
             C53,117 55,114 57,114
             C59,114 61,117 63,121
             C64,123 67,123 68,121
             C71,118 75,111 77,104
             C81,92 80,74 72,64 Z" fill="#fdfdfb"/>
    <!-- soft belly shadow -->
    <path d="M40,102 C48,111 66,111 74,102 C73,110 66,114 57,114 C48,114 41,110 40,102 Z" fill="#e7e4dc" stroke="none"/>

    <!-- ===== LEFT ARM (white stub at side) ===== -->
    <path d="M42,78 Q33,80 28,86" fill="none" stroke="#4a3728" stroke-width="10"/>
    <path d="M42,78 Q33,80 28,86" fill="none" stroke="#fdfdfb" stroke-width="6"/>

    <!-- ===== RIGHT ARM (white stub reaching to bomb) ===== -->
    <path d="M72,80 Q83,80 90,84" fill="none" stroke="#4a3728" stroke-width="10"/>
    <path d="M72,80 Q83,80 90,84" fill="none" stroke="#fdfdfb" stroke-width="6"/>

    <!-- ===== HEAD (big round white head) ===== -->
    <circle cx="57" cy="43" r="25" fill="#fdfdfb"/>

    <!-- ===== FACE ===== -->
    <!-- eye patches (black, slightly vertical) -->
    <ellipse cx="48" cy="44" rx="6" ry="8" fill="#2b2b2b" stroke-width="2.4"/>
    <ellipse cx="66" cy="44" rx="6" ry="8" fill="#2b2b2b" stroke-width="2.4"/>
    <!-- eyes (white then black pupil + highlight) -->
    <circle cx="48" cy="45" r="3.1" fill="#ffffff" stroke="none"/>
    <circle cx="66" cy="45" r="3.1" fill="#ffffff" stroke="none"/>
    <circle cx="48.4" cy="45.4" r="1.9" fill="#2b2b2b" stroke="none"/>
    <circle cx="66.4" cy="45.4" r="1.9" fill="#2b2b2b" stroke="none"/>
    <circle cx="47.7" cy="44.5" r="0.8" fill="#ffffff" stroke="none"/>
    <circle cx="65.7" cy="44.5" r="0.8" fill="#ffffff" stroke="none"/>
    <!-- cheeks (blush) -->
    <ellipse cx="42" cy="54" rx="4" ry="2.6" fill="#ffc2cf" stroke="none"/>
    <ellipse cx="72" cy="54" rx="4" ry="2.6" fill="#ffc2cf" stroke="none"/>
    <!-- nose -->
    <ellipse cx="57" cy="53" rx="3" ry="2.2" fill="#2b2b2b" stroke-width="1.6"/>
    <!-- happy smile -->
    <path d="M57,55 Q53,59.5 49.5,56.5" fill="none" stroke-width="2.2"/>
    <path d="M57,55 Q61,59.5 64.5,56.5" fill="none" stroke-width="2.2"/>

    <!-- ===== BOMB (black round ball in right hand) ===== -->
    <circle cx="97" cy="88" r="9.5" fill="#2b2b33"/>
    <ellipse cx="93.5" cy="84.5" rx="2.6" ry="1.6" fill="#4c4c58" stroke="none" transform="rotate(-35 93.5 84.5)"/>
    <!-- fuse cap -->
    <rect x="93" y="74" width="8" height="6" rx="1.5" fill="#8a6a3a"/>
    <!-- fuse -->
    <path d="M97,75 Q101,68 106,66" fill="none" stroke="#4a3728" stroke-width="2.4"/>
    <!-- spark (red star) -->
    <g stroke="none">
      <path d="M108,60 L110,65 L115,65.5 L111,69 L112.5,74 L108,71 L103.5,74 L105,69 L101,65.5 L106,65 Z" fill="#ff3b3b"/>
      <path d="M108,63 L109,66 L112,66.3 L109.7,68.3 L110.5,71.3 L108,69.6 L105.5,71.3 L106.3,68.3 L104,66.3 L107,66 Z" fill="#ffd23f"/>
    </g>
    <!-- right paw gripping bomb -->
    <circle cx="90" cy="84" r="5" fill="#fdfdfb"/>

  </g>
</svg>
