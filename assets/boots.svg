<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- ジャンプ靴：ミント色のブーツ＋黄色い3本ヅメ（子どもの手描きに忠実） -->
  <g stroke="#4a3728" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- ブーツ本体（ミント） -->
    <path d="M42,52
             L86,52
             L86,70
             C100,73 108,83 108,96
             C108,107 99,113 86,113
             L40,113
             C23,113 16,100 16,85
             C16,66 27,55 42,52 Z" fill="#b9f2e2"/>
    <!-- 底の影 -->
    <path d="M18,94 C24,108 40,113 40,113 L86,113 C99,113 108,107 108,96
             C103,105 95,107 86,107 L40,107 C30,107 22,101 18,94 Z"
          fill="#8fe0cd" stroke="none"/>
    <!-- はき口（上のあいた部分） -->
    <path d="M42,52 L86,52 L86,63 C74,58 52,58 42,63 Z" fill="#7fd8c4"/>
    <ellipse cx="64" cy="53" rx="23" ry="6" fill="#6fcbb6" stroke-width="2.4"/>
    <!-- 黄色い3本ヅメ（つま先の下） -->
    <g fill="#f4e94b">
      <path d="M22,95 C17,101 17,110 21,115 C26,110 27,101 25,95 Z"/>
      <path d="M35,100 C30,106 30,115 34,120 C39,115 40,106 38,100 Z"/>
      <path d="M48,101 C43,107 43,116 47,121 C52,116 53,107 51,101 Z"/>
    </g>
    <!-- ハイライト -->
    <path d="M35,64 C29,68 25,74 25,82" fill="none" stroke="#dafaf1" stroke-width="3"/>
  </g>
</svg>
