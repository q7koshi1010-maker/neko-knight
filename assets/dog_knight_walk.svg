    <path d="M67,27 C79,19 93,25 94,40 C95,52 88,62 77,61 C70,60 67,53 66,46 Z" fill="#fdfbf5"/>
    <path d="M23,45 C26,56 33,60 41,56 C35,60 27,57 23,45 Z" fill="#eae4d6" stroke="none"/>
    <path d="M89,45 C86,56 79,60 71,56 C77,60 85,57 89,45 Z" fill="#eae4d6" stroke="none"/>

    <!-- ===== FACE ===== -->
    <ellipse cx="45" cy="50" rx="4.6" ry="3" fill="#ffc2cf" stroke="none"/>
    <ellipse cx="67" cy="50" rx="4.6" ry="3" fill="#ffc2cf" stroke="none"/>
    <circle cx="48" cy="42" r="3.2" fill="#3a2d24" stroke="none"/>
    <circle cx="64" cy="42" r="3.2" fill="#3a2d24" stroke="none"/>
    <circle cx="46.9" cy="40.9" r="1" fill="#ffffff" stroke="none"/>
    <circle cx="62.9" cy="40.9" r="1" fill="#ffffff" stroke="none"/>
    <path d="M53,49 Q56,46.5 59,49 Q59,52.5 56,53.2 Q53,52.5 53,49 Z" fill="#f28fa0" stroke-width="2"/>
    <path d="M56,53.2 L56,56" fill="none" stroke-width="2"/>
    <path d="M56,56 Q52,59.5 49,56.5" fill="none" stroke-width="2.2"/>
    <path d="M56,56 Q60,59.5 63,56.5" fill="none" stroke-width="2.2"/>

    <!-- ===== SWORD (right side, pointing up, cross guard) ===== -->
    <g>
      <path d="M94,80 L102,80 L102,46 L98,36 L94,46 Z" fill="#c9ccd4"/>
      <path d="M98,44 L98,78" fill="none" stroke="#eef1f6" stroke-width="1.5"/>
      <rect x="86" y="79" width="24" height="5" rx="2" fill="#9aa0ab"/>
      <rect x="95" y="84" width="6" height="12" rx="2" fill="#9aa0ab"/>
