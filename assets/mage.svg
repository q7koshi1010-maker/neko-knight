<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <g stroke="#4a3728" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- small simple body / robe -->
    <path d="M50 92 Q44 96 43 108 L42 118 Q42 121 46 121 L82 121 Q86 121 86 118 L85 108 Q84 96 78 92 Z" fill="#5b4a8a"/>
    <path d="M52 108 Q64 114 76 108 Q74 119 64 119 Q54 119 52 108 Z" fill="#4a3b73" stroke="none"/>

    <!-- round face -->
    <circle cx="64" cy="52" r="19" fill="#f4d9b8"/>

    <!-- big fuzzy scalloped beard / cheeks covering most of the face -->
    <path d="M45 54
             Q41 61 46 66 Q43 72 49 75 Q50 82 57 81
             Q60 86 64 85 Q68 86 71 81 Q78 82 79 75
             Q85 72 82 66 Q87 61 83 54
             Q75 63 64 63 Q53 63 45 54 Z" fill="#f2efe8"/>

    <!-- rounded dome (bowler-style) hat -->
    <path d="M43 41 Q64 48 85 41 Q88 45 84 47 Q64 53 44 47 Q40 45 43 41 Z" fill="#3f3468"/>
    <path d="M48 43 Q42 18 64 16 Q86 18 80 43 Q64 37 48 43 Z" fill="#3f3468"/>
    <path d="M52 33 Q64 28 76 33" fill="none" stroke="#5a4e86" stroke-width="2"/>
  </g>

  <!-- dot eyes -->
  <circle cx="59" cy="51" r="2.2" fill="#3a2d24"/>
  <circle cx="71" cy="51" r="2.2" fill="#3a2d24"/>
  <!-- small nose (points right) -->
  <path d="M64 53 L69 56 L64 59 Z" fill="#e6b98f" stroke="#4a3728" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- soft cheeks -->
  <ellipse cx="54" cy="56" rx="2.6" ry="1.8" fill="#f0aca4" stroke="none"/>
  <ellipse cx="74" cy="56" rx="2.6" ry="1.8" fill="#f0aca4" stroke="none"/>

  <!-- subtle staff added lightly on the side -->
  <line x1="90" y1="66" x2="94" y2="116" stroke="#6b5638" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="89" cy="61" r="5.6" fill="#8fd8e8" stroke="#4a3728" stroke-width="2.2"/>
  <circle cx="89" cy="61" r="2.2" fill="#dcf6fb" stroke="none"/>
</svg>
