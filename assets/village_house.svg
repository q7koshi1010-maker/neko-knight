<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220">
  <!-- 村の家1軒：茶色い三角屋根＋肌色の壁＋白い十字窓＋こげ茶のアーチドア。底辺 y≈214。少し歪んだ手描き感。 -->
  <g stroke="#5b4636" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- 肌色の壁（少し歪ませる） -->
    <path d="M41,109 L139,105 L142,214 L38,214 Z" fill="#f2c9a4"/>
    <!-- 壁の下側の軽い陰影 -->
    <path d="M39,168 L141,166 L142,214 L38,214 Z" fill="#e6b892" opacity="0.55" stroke="none"/>
    <!-- 茶色い三角屋根（軒が壁より外に出る） -->
    <path d="M20,113 L90,28 L160,109 Z" fill="#7a5a43"/>
    <!-- 屋根の稜線ハイライト -->
    <path d="M90,34 L26,110" fill="none" stroke="#8f6c51" stroke-width="2.6" stroke-opacity="0.7"/>
    <!-- 白い十字の窓（ガラスは薄い水色） -->
    <rect x="52" y="124" width="40" height="46" rx="3" fill="#cfeff0"/>
    <!-- 白い十字枠 -->
    <rect x="69" y="124" width="6" height="46" fill="#ffffff" stroke="none"/>
    <rect x="52" y="144" width="40" height="6" fill="#ffffff" stroke="none"/>
    <!-- 窓枠の輪郭を上描き -->
    <rect x="52" y="124" width="40" height="46" rx="3" fill="none"/>
    <!-- こげ茶のアーチ型ドア -->
    <path d="M100,214 L100,169 Q100,150 118,150 Q136,150 136,169 L136,214 Z" fill="#7a5540"/>
    <!-- ドアの取っ手 -->
    <circle cx="104" cy="186" r="2.6" fill="#3f2c22" stroke="none"/>
  </g>
</svg>
