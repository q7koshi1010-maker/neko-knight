<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <g stroke="#4a3728" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== SWORD (lowered / pulled back BEHIND body, pointing DOWN, modest) ===== -->
    <g>
      <path d="M88,92 L96,92 L96,114 L92,122 L88,114 Z" fill="#c9ccd4"/>
      <path d="M92,94 L92,113" fill="none" stroke="#eef1f6" stroke-width="1.5"/>
      <rect x="83" y="86" width="18" height="5" rx="2" fill="#9aa0ab"/>
      <rect x="89" y="76" width="6" height="10" rx="2" fill="#9aa0ab"/>
      <circle cx="92" cy="74" r="3" fill="#9aa0ab"/>
    </g>
    <!-- right paw gripping lowered sword -->
    <circle cx="92" cy="88" r="5" fill="#fdfdfb"/>

    <!-- ===== BODY (same narrow fluffy 'mokomoko' body, 2 legs) ===== -->
    <path d="M46,64
             C40,73 38,88 41,102
             C42,108 45,116 48,120
             C49,122 51,122 52,120
             C54,116 56,113 59,113
             C62,113 64,116 66,120
             C67,122 69,122 70,120
             C73,116 76,108 77,102
             C80,88 78,73 72,64 Z" fill="#fdfdfb"/>
    <!-- soft belly shadow -->
    <path d="M44,101 C51,110 67,110 74,101 C73,109 66,113 59,113 C52,113 45,109 44,101 Z" fill="#e7e4dc" stroke="none"/>

    <!-- ===== HEAD + EARS (same big independent round head, notch between ears) ===== -->
    <path d="M34,30
             L36,8
             L53,24
             Q57,21 61,24
             L78,8
             L80,30
             C89,40 89,58 77,67
             C70,72 64,73 57,73
             C50,73 44,72 37,67
             C25,58 25,40 34,30 Z" fill="#fdfdfb"/>
    <!-- inner ears -->
    <path d="M40,14 L37,27 L50,24 Z" fill="#ffc2cf" stroke="none"/>
    <path d="M74,14 L64,24 L77,27 Z" fill="#ffc2cf" stroke="none"/>

    <!-- ===== FACE (same cat: he-no-ji brows, dot eyes, whiskers, pink cheeks) ===== -->
    <!-- cheeks (blush) -->
    <ellipse cx="45" cy="51" rx="5" ry="3.2" fill="#ffc2cf" stroke="none"/>
    <ellipse cx="69" cy="51" rx="5" ry="3.2" fill="#ffc2cf" stroke="none"/>
    <!-- eyebrows (he-no-ji, a touch more level = focused, still gentle) -->
    <path d="M43,38 Q49,33 55,37" fill="none" stroke-width="2.7"/>
    <path d="M59,37 Q65,33 71,38" fill="none" stroke-width="2.7"/>
    <!-- eyes (small round dots, looking forward) -->
    <circle cx="49" cy="45" r="3.1" fill="#3a2d24" stroke="none"/>
    <circle cx="65" cy="45" r="3.1" fill="#3a2d24" stroke="none"/>
    <circle cx="47.9" cy="43.9" r="1" fill="#ffffff" stroke="none"/>
    <circle cx="63.9" cy="43.9" r="1" fill="#ffffff" stroke="none"/>
    <!-- nose -->
    <path d="M54,50 L60,50 L57,54 Z" fill="#ff8fa3" stroke-width="2"/>
    <!-- small determined mouth (same gentle style) -->
    <path d="M57,54 Q53,58 50,55.5" fill="none" stroke-width="2.2"/>
    <path d="M57,54 Q61,58 64,55.5" fill="none" stroke-width="2.2"/>
    <!-- whiskers (3 each side) -->
    <g stroke-width="1.7">
      <path d="M39,47 L20,43" fill="none"/>
      <path d="M39,52 L18,52" fill="none"/>
      <path d="M39,57 L20,61" fill="none"/>
      <path d="M75,47 L94,43" fill="none"/>
      <path d="M75,52 L96,52" fill="none"/>
      <path d="M75,57 L94,61" fill="none"/>
    </g>

    <!-- ===== SHIELD (held big at the FRONT / right of the body, gray cross clear) ===== -->
    <g>
      <path d="M60,60 L94,60 L94,90 C94,102 77,111 77,111 C77,111 60,102 60,90 Z" fill="#c9ccd4"/>
      <path d="M64,64 L90,64 L90,88 C90,98 77,105 77,105" fill="none" stroke="#eef1f6" stroke-width="1.5"/>
      <!-- gray cross -->
      <rect x="74" y="66" width="6" height="37" rx="1.4" fill="#9aa0ab" stroke-width="2.4"/>
      <rect x="64" y="79" width="26" height="6" rx="1.4" fill="#9aa0ab" stroke-width="2.4"/>
    </g>
    <!-- left paw bracing the shield -->
    <circle cx="61" cy="84" r="5.2" fill="#fdfdfb"/>

  </g>
</svg>
