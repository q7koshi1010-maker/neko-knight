<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <g stroke="#4a3728" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail fin (bottom-left, wavy) -->
    <path d="M36 98
             C24 92 12 96 7 108
             C15 106 19 108 23 112
             C21 118 28 121 34 116
             C32 108 37 104 42 104 Z" fill="#7aa7ba"/>
    <!-- dorsal fin (top) -->
    <path d="M52 40 Q62 14 80 40 Z" fill="#7aa7ba"/>
    <!-- pectoral fin (right side) -->
    <path d="M90 86 C103 92 104 106 94 107 C91 99 87 91 90 86 Z" fill="#7aa7ba"/>
    <!-- body (comma-shaped) -->
    <path d="M96 58
             C100 43 89 33 69 34
             C49 35 34 43 28 61
             C22 79 26 101 45 111
             C65 120 91 114 101 96
             C106 86 103 72 96 64 Z" fill="#8fb8c9"/>
    <!-- belly -->
    <path d="M31 86 C41 110 80 114 100 95 C83 104 51 103 41 87 Z"
          fill="#dff0f4" stroke="none"/>
    <!-- mouth interior (pink), opening on the right -->
    <path d="M63 66
             C73 58 87 54 97 55
             C99 66 98 77 94 85
             C81 85 71 76 63 66 Z" fill="#e59ba8"/>
    <!-- upper teeth -->
    <path d="M63 66 L67 71 L71 62 L75 68 L79 59 L84 66 L88 57 L92 63 L97 55 Z"
          fill="#ffffff" stroke-width="2.2"/>
    <!-- lower teeth -->
    <path d="M63 66 L66 71 L71 64 L75 74 L80 68 L84 78 L89 72 L94 85 Z"
          fill="#ffffff" stroke-width="2.2"/>
    <!-- gills -->
    <path d="M36 58 Q33 68 37 78" fill="none" stroke-width="2.2"/>
    <path d="M43 55 Q40 66 44 77" fill="none" stroke-width="2.2"/>
    <!-- cheek whisker lines -->
    <path d="M40 70 L52 72" fill="none" stroke-width="2"/>
    <path d="M40 76 L52 76" fill="none" stroke-width="2"/>
    <path d="M42 82 L53 80" fill="none" stroke-width="2"/>
    <!-- cheek blush -->
    <circle cx="46" cy="74" r="4.5" fill="#f3b6cf" stroke="none" opacity="0.7"/>
    <!-- angry eyebrow -->
    <path d="M46 49 L60 55" fill="none" stroke-width="3"/>
    <!-- eye -->
    <ellipse cx="55" cy="61" rx="4.4" ry="5" fill="#2b2b33" stroke="none"/>
    <circle cx="56.6" cy="59.2" r="1.3" fill="#ffffff" stroke="none"/>
  </g>
</svg>
